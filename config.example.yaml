experiment:
  algorithm: sqrl_sac
  environment: go2

runner:
  # The CLI command is the single source of train/test mode.
  evaluation_episodes: 10

algorithm:
  device: gpu
  compile_mode: reduce-overhead
  bf16_mixed_precision_training: false
  # Explicit units: n_pre/n_target count environment transitions.
  n_pre: 500000
  n_target: 500000
  # Local vector schedule; the paper defines n_off but reports no default.
  n_off: 1
  # Algorithm 1 line 17 is one QSafe gradient update per completed block.
  qsafe_optimizer_steps_per_block: 1
  learning_rate: 0.0003
  buffer_size: 1000000
  # Local SAC update delay (and task-pretrain random-action threshold).
  # This value is not specified by the SQRL paper.
  learning_starts: 5000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  safe_gamma: 0.7
  epsilon_safe: 0.1
  # Finite-sample approximation; the SQRL paper reports no candidate count.
  max_safe_action_samples: 100
  target_entropy: auto
  log_std_min: -20
  log_std_max: 2
  nr_hidden_units: 256
  logging_frequency: 50000

environment:
  seed: 0
  device: gpu
  render: false
