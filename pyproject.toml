[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-x"
version = "0.1.0"
description = "Reinforcement-learning algorithms and experiment runner for safe robot adaptation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Runner and environment interfaces shared by all targets.
    "absl-py>=2.0",
    "ml-collections>=0.1.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
mujoco = [
    "mujoco>=3.1",
]
inference = [
    "jax>=0.6",
    "flax>=0.10",
    "optax>=0.2",
    "orbax-checkpoint>=0.11",
    "dm-tree>=0.1.8",
    # Current RL-X Flax algorithms import wandb at module import time.
    "wandb>=0.18",
]

[tool.setuptools.packages.find]
include = ["rl_x*"]
